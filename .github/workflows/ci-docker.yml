name: CI and Docker Build (C-01)

on:
  workflow_call:
  pull_request:
    branches:
      - main
      - staging-lab5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-docker:
    name: test-and-docker
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsss_user
          POSTGRES_PASSWORD: whatsss_password
          POSTGRES_DB: whatsss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify Secret & Credential Safety (Gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ------------------------------------------------------------------------
      # 1. Backend Pipeline
      # ------------------------------------------------------------------------
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Deploy Prisma Migrations
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
          JWT_SECRET: "ci_pipeline_cryptographically_secure_jwt_secret_key_32_chars"
        run: npx tsx prisma/seed.ts

      - name: Run Backend Automated Tests
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
          JWT_SECRET: "ci_pipeline_cryptographically_secure_jwt_secret_key_32_chars"
          CLIENT_URL: "http://localhost:5173"
          PORT: "8080"
          NODE_ENV: test
        run: npm test

      - name: Build Server
        working-directory: server
        run: npm run build

      # ------------------------------------------------------------------------
      # 2. Frontend Pipeline
      # ------------------------------------------------------------------------
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend Automated Tests
        working-directory: client
        run: npm test

      - name: Build Client
        working-directory: client
        run: npm run build

      # ------------------------------------------------------------------------
      # 3. Deployment Script Verification & Docker Build / Probe
      # ------------------------------------------------------------------------
      - name: Lint Deployment Scripts (if present)
        run: |
          if [ -d "deploy" ]; then
            echo "Linting shell scripts in deploy/..."
            find deploy -name "*.sh" -exec bash -n {} +
          else
            echo "No deploy/ directory present yet, skipping script lint."
          fi

      - name: ShellCheck Deployment Scripts
        run: |
          if [ -d "deploy" ]; then
            if ! command -v shellcheck >/dev/null 2>&1; then
              sudo apt-get update && sudo apt-get install -y shellcheck
            fi
            shellcheck --version
            shellcheck deploy/*.sh deploy/tests/*.sh deploy/tests/mocks/*
          fi

      - name: Validate GitHub Actions Workflow Files (actionlint)
        run: |
          ACTIONLINT_VERSION="1.7.4"
          ACTIONLINT_SHA256="fc0a6886bbb9a23a39eeec4b176193cadb54ddbe77cdbb19b637933919545395"
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          ./actionlint .github/workflows/ci-docker.yml .github/workflows/deploy.yml

      - name: Run Deployment Script Tests
        run: |
          if [ -d "deploy/tests" ]; then
            bash deploy/tests/test-deploy.sh
            bash deploy/tests/test-release.sh
          fi

      - name: Set up Python for Deploy Tests
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Validate Smoke Test Python Syntax & Run Unit Tests
        run: |
          python3 -m py_compile deploy/smoke_test.py deploy/extract_revision_sha.py deploy/verify_traffic.py
          python3 -m unittest discover -s deploy/tests -p "test_*.py" -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0

      - name: Build Production Multi-stage Docker Image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg APP_COMMIT_SHA="${{ github.sha }}" \
            -t whatsss:pr-${{ github.sha }} .

      - name: Inspect Docker Image Layers & Filesystem for Leaked Secrets (P2-12)
        run: |
          echo "Inspecting Docker image history and /app filesystem for forbidden secret files..."
          LEAKED_IN_IMAGE=$(docker run --rm --entrypoint sh "whatsss:pr-${{ github.sha }}" -c 'find /app -maxdepth 4 \( -name ".env" -o -name ".env.*" -o -name "*.pem" -o -name "*.key" -o -name "*service-account*.json" \) ! -name ".env.example" 2>/dev/null || true')
          if [ -n "$LEAKED_IN_IMAGE" ]; then
            echo "::error::Forbidden credential or .env file found inside Docker image:"
            echo "$LEAKED_IN_IMAGE"
            exit 1
          fi
          if docker history --no-trunc "whatsss:pr-${{ github.sha }}" | grep -iE "SEED_ADMIN_PASSWORD|SEED_DEMO_PASSWORD|JWT_SECRET|POSTGRES_PASSWORD"; then
            echo "::error::Secret env leaked in Docker image history!"
            exit 1
          fi
          echo "Verified: Zero secret files or build-layer credentials present inside production Docker image."

      - name: Verify Container Startup, Liveness & Database Readiness Probes
        run: |
          CONTAINER_NAME="whatsss-pr-test"

          # Guarantee container cleanup on script exit, success, or failure
          cleanup() {
            echo "Cleaning up container $CONTAINER_NAME..."
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          }
          trap cleanup EXIT

          echo "Starting production Docker container with database connectivity..."
          docker run -d --name "$CONTAINER_NAME" \
            --network host \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e HOST=0.0.0.0 \
            -e JWT_SECRET="ci_test_super_secret_jwt_key_at_least_32_chars" \
            -e CLIENT_URL="http://localhost:8080" \
            -e DATABASE_URL="postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public" \
            whatsss:pr-${{ github.sha }}

          echo "Waiting for container and database readiness probe (/api/ready)..."
          is_ready=false
          for i in {1..30}; do
            READY_RESPONSE=$(curl -s http://127.0.0.1:8080/api/ready || echo "unreachable")
            if echo "$READY_RESPONSE" | grep -q '"status":"ready"'; then
              is_ready=true
              echo "Container database probe PASSED on attempt $i ($READY_RESPONSE)"
              break
            fi
            echo "Waiting for container readiness ($i/30): $READY_RESPONSE"
            sleep 1
          done

          if [ "$is_ready" != "true" ]; then
            echo "::error::Container failed readiness check (/api/ready)"
            echo "--- Container Logs ---"
            docker logs "$CONTAINER_NAME"
            exit 1
          fi

          echo "Testing Liveness Probe (/api/health)..."
          curl -f http://127.0.0.1:8080/api/health

          echo "Testing Database Readiness Probe (/api/ready)..."
          curl -f http://127.0.0.1:8080/api/ready

          echo "Testing SPA Static Asset Serving (/)..."
          curl -f http://127.0.0.1:8080/

      # ------------------------------------------------------------------------
      # 4. Check C-03 Clean Clone Build, Migration Gate & Run Verification
      # ------------------------------------------------------------------------
      - name: Perform Clean Git Clone into Isolated Workspace (C-03)
        run: |
          echo "Cloning clean repository from current workspace into isolated directory..."
          rm -rf ../clean-clone-test
          git clone "$GITHUB_WORKSPACE" ../clean-clone-test
          cd ../clean-clone-test
          git checkout "${{ github.sha }}"
          echo "Clean clone verified at commit: $(git rev-parse HEAD)"

      - name: Prepare .env with Special-Character DB Password & URL-Encoded DOCKER_DATABASE_URL
        working-directory: ../clean-clone-test
        run: |
          cp .env.example .env

          # Generate dynamic random secrets including special URI characters (@, #, /, :) in POSTGRES_PASSWORD
          HEX_PART="$(openssl rand -hex 8)"
          CI_ADMIN_PWD="Admin_$(openssl rand -hex 12)!"
          CI_DEMO_PWD="Demo_$(openssl rand -hex 12)!"
          CI_PG_PWD="Pg@${HEX_PART}#pass/123:ok"
          CI_PG_PWD_ENCODED="Pg%40${HEX_PART}%23pass%2F123%3Aok"
          RANDOM_JWT="$(openssl rand -hex 32)"

          # Mask generated credentials in GitHub Actions logs
          echo "::add-mask::${CI_ADMIN_PWD}"
          echo "::add-mask::${CI_DEMO_PWD}"
          echo "::add-mask::${CI_PG_PWD}"
          echo "::add-mask::${CI_PG_PWD_ENCODED}"
          echo "::add-mask::${RANDOM_JWT}"

          # Use host port 5433 for compose postgres to avoid port collision with the CI service container on 5432
          sed -i "s|POSTGRES_PORT=5432|POSTGRES_PORT=5433|g" .env
          sed -i "s|replace_with_a_long_random_secret_at_least_32_characters_for_production|${RANDOM_JWT}|g" .env
          sed -i "s|replace_with_secure_admin_password_min_12_chars|${CI_ADMIN_PWD}|g" .env
          sed -i "s|replace_with_secure_postgres_password_for_local|${CI_PG_PWD}|g" .env
          sed -i "s|SEED_DEMO_DATA=false|SEED_DEMO_DATA=true|g" .env
          sed -i "s|replace_with_secure_demo_password_min_12_chars|${CI_DEMO_PWD}|g" .env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=\"postgresql://postgres:${CI_PG_PWD_ENCODED}@localhost:5433/whatsss_db?schema=public\"|g" .env
          echo "DOCKER_DATABASE_URL=postgresql://postgres:${CI_PG_PWD_ENCODED}@postgres:5432/whatsss_db?schema=public" >> .env

          # Validate Docker Compose syntax quietly without printing sensitive environment values
          docker compose config -q

          # Save demo user credentials for downstream authentication step
          echo "CI_DEMO_PWD=${CI_DEMO_PWD}" >> "$GITHUB_ENV"

      - name: Verify Migration Failure Gate Blocks App Startup (service_completed_successfully)
        working-directory: ../clean-clone-test
        run: |
          docker tag "whatsss:pr-${{ github.sha }}" whatsss:local
          cleanup_mig_fail() {
            docker compose -p whatsss_mig_fail_ci down -v 2>/dev/null || true
          }
          trap cleanup_mig_fail EXIT

          echo "Simulating migration failure with unreachable database host in DOCKER_DATABASE_URL..."
          if DOCKER_DATABASE_URL="postgresql://postgres:invalid@127.0.0.1:59999/whatsss_db?schema=public" \
             POSTGRES_PORT=5434 PORT=8081 \
             docker compose -p whatsss_mig_fail_ci up -d app; then
            echo "::error::Expected docker compose up -d app to fail when migrate fails!"
            exit 1
          fi

          APP_RUNNING=$(docker compose -p whatsss_mig_fail_ci ps -q --status running app 2>/dev/null || true)
          if [ -n "$APP_RUNNING" ]; then
            echo "::error::App container started despite migration failure!"
            exit 1
          fi
          echo "Verified: Migration failure gate prevented app container from starting."

      - name: Start Full Stack with Docker Compose (C-03)
        working-directory: ../clean-clone-test
        run: |
          docker compose -p whatsss_c03_ci up -d --build

          healthy=false
          for i in {1..30}; do
            APP_CID=$(docker compose -p whatsss_c03_ci ps -q app 2>/dev/null || true)
            HEALTH_STATUS="starting"
            if [ -n "$APP_CID" ]; then
              HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$APP_CID" 2>/dev/null || echo "starting")
            fi
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              healthy=true
              break
            fi
            echo "Waiting for app healthcheck ($i/30): $HEALTH_STATUS"
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Application failed to become healthy within timeout"
            docker compose -p whatsss_c03_ci ps
            docker compose -p whatsss_c03_ci logs --no-color --tail=200
            exit 1
          fi

          echo "Application is healthy!"
          docker compose -p whatsss_c03_ci ps
          docker compose -p whatsss_c03_ci logs migrate

      - name: Verify Liveness & Readiness State Discrimination (200 -> 503 -> 200)
        working-directory: ../clean-clone-test
        run: |
          echo "1. Probing /api/health (Liveness)..."
          HEALTH_RES=$(curl -f -s -i http://localhost:8080/api/health)
          echo "$HEALTH_RES" | grep "HTTP/1.1 200 OK"
          echo "$HEALTH_RES" | grep '"status":"ok"'

          echo "2. Asserting /api/ready returns 200 OK when database is connected..."
          READY_200=$(curl -s -i http://localhost:8080/api/ready)
          echo "$READY_200" | grep "HTTP/1.1 200 OK"
          echo "$READY_200" | grep '"database":"connected"'

          trap 'docker compose -p whatsss_c03_ci start postgres || true' EXIT

          echo "3. Stopping PostgreSQL container to simulate database outage..."
          docker compose -p whatsss_c03_ci stop postgres

          echo "4. Asserting /api/ready returns 503 Service Unavailable during outage..."
          READY_503=$(curl -s -i http://localhost:8080/api/ready)
          echo "$READY_503" | grep "HTTP/1.1 503"
          echo "$READY_503" | grep '"database":"disconnected"'

          echo "5. Asserting /api/health still returns 200 OK during DB outage..."
          LIVENESS_200=$(curl -s -i http://localhost:8080/api/health)
          echo "$LIVENESS_200" | grep "HTTP/1.1 200 OK"

          echo "6. Restarting PostgreSQL container to simulate recovery..."
          docker compose -p whatsss_c03_ci start postgres

          PG_STATUS="starting"
          for attempt in {1..20}; do
            PG_CID=$(docker compose -p whatsss_c03_ci ps -q postgres 2>/dev/null || true)
            if [ -n "$PG_CID" ]; then
              PG_STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$PG_CID" 2>/dev/null || echo "starting")
            fi
            if [ "$PG_STATUS" = "healthy" ]; then
              echo "PostgreSQL recovered on attempt ${attempt}/20"
              break
            fi
            sleep 1
          done

          if [ "$PG_STATUS" != "healthy" ]; then
            echo "::error::PostgreSQL failed to recover within timeout"
            exit 1
          fi

          echo "7. Asserting /api/ready returns 200 OK after database recovery..."
          READY_RECOVERED=$(curl -s -i http://localhost:8080/api/ready)
          echo "$READY_RECOVERED" | grep "HTTP/1.1 200 OK"
          echo "$READY_RECOVERED" | grep '"database":"connected"'

      - name: End-to-End API Authentication, Transaction Creation & Volume Persistence (C-03)
        working-directory: ../clean-clone-test
        run: |
          echo "Authenticating as user_demo..."
          LOGIN_RES=$(curl -s -i -c cookie.txt -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:8080" \
            -d "{\"username\":\"user_demo\",\"password\":\"${CI_DEMO_PWD}\"}")
          echo "$LOGIN_RES" | grep "HTTP/1.1 200 OK"

          ACCOUNTS_RES=$(curl -s -b cookie.txt http://localhost:8080/api/accounts)
          CHECKING_ID=$(echo "$ACCOUNTS_RES" | jq -er '.data.accounts[] | select(.name == "Checking Bank") | .id')
          SALARY_ID=$(echo "$ACCOUNTS_RES" | jq -er '.data.accounts[] | select(.name == "Salary") | .id')

          echo "Recording income transaction of 25000.00 THB..."
          TX_RES=$(curl -s -i -b cookie.txt -X POST http://localhost:8080/api/transactions/income \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:8080" \
            -d "{\"primary_account_id\":\"${CHECKING_ID}\",\"income_account_id\":\"${SALARY_ID}\",\"total_amount\":\"25000.00\",\"transaction_date\":\"2026-11-13\",\"description\":\"CI C-03 Clean Clone Verification Transaction\"}")
          echo "$TX_RES" | grep "HTTP/1.1 201 Created"

          echo "Executing docker compose down (preserving volume) and re-launching stack..."
          docker compose -p whatsss_c03_ci down
          docker compose -p whatsss_c03_ci up -d

          healthy=false
          for attempt in {1..30}; do
            APP_CID=$(docker compose -p whatsss_c03_ci ps -q app 2>/dev/null || true)
            HEALTH_STATUS="starting"
            if [ -n "$APP_CID" ]; then
              HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$APP_CID" 2>/dev/null || echo "starting")
            fi
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              echo "Application recovered on attempt ${attempt}/30"
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Application failed to become healthy after restart"
            exit 1
          fi

          curl -s -i -c cookie_post.txt -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:8080" \
            -d "{\"username\":\"user_demo\",\"password\":\"${CI_DEMO_PWD}\"}" | grep "HTTP/1.1 200 OK"

          TX_LIST=$(curl -s -b cookie_post.txt http://localhost:8080/api/transactions)
          echo "$TX_LIST" | grep "CI C-03 Clean Clone Verification Transaction"

      - name: Clean up Docker Compose Stack
        if: always()
        run: |
          if [ -d "../clean-clone-test" ]; then
            cd ../clean-clone-test
            docker compose -p whatsss_c03_ci down -v || true
          fi
