name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Rollback: full commit SHA of an existing image. Empty = test, build and deploy current main.'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  test:
    name: Test & Build Gate
    if: ${{ github.event.inputs.image_tag == '' }}
    uses: ./.github/workflows/ci-docker.yml

  deploy:
    name: Deploy to Cloud Run
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@71fee339e7287955519cc3efdd6fa62024cc5418 # v2.1.8
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@618f082e2282e5229e71f99c38860340281a05cc # v2.1.4

      - name: Set up Docker Buildx
        if: ${{ github.event.inputs.image_tag == '' }}
        uses: docker/setup-buildx-action@b5ca514310cf821ea81b438e64c18ab862353724 # v3.10.0

      - name: Configure Docker authentication for Artifact Registry
        if: ${{ github.event.inputs.image_tag == '' }}
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Resolve Image Tag & Target Metadata
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            IS_ROLLBACK="true"
          else
            IMAGE_TAG="${{ github.sha }}"
            IS_ROLLBACK="false"
          fi
          
          IMAGE_BASE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/whatsss/whatsss"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "is_rollback=${IS_ROLLBACK}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        if: ${{ github.event.inputs.image_tag == '' }}
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_base }}:latest
          build-args: |
            APP_COMMIT_SHA=${{ steps.meta.outputs.image_tag }}

      - name: Resolve Immutable Image Digest
        id: digest
        run: |
          IMAGE_URI="${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.image_tag }}"
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE_URI}" --format='value(image_summary.digest)')"
          if [ -z "${DIGEST}" ]; then
            echo "ERROR: Failed to resolve image digest for ${IMAGE_URI}" >&2
            exit 1
          fi
          IMAGE_REF="${{ steps.meta.outputs.image_base }}@${DIGEST}"
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "Resolved Immutable Image Ref: ${IMAGE_REF}"

      - name: Execute Migration & Rollout Cloud Run Service (release.sh)
        id: release
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          APP_COMMIT_SHA: ${{ steps.meta.outputs.image_tag }}
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          DB_URL_VERSION: "1"
          JWT_SECRET_VERSION: "1"
          ADMIN_PASSWORD_VERSION: "1"
          DEMO_PASSWORD_VERSION: "1"
        run: |
          chmod +x deploy/release.sh
          bash deploy/release.sh
          SERVICE_URL="$(gcloud run services describe whatsss --region="${{ vars.GCP_REGION }}" --project="${{ vars.GCP_PROJECT_ID }}" --format='value(status.url)')"
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Set up Python for Smoke Test
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'

      - name: Smoke test public URL
        env:
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          python3 deploy/smoke_test.py "${{ steps.release.outputs.service_url }}"

      - name: Record deployment summary
        if: ${{ always() }}
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## Whatsss demo deployment

          * **Commit image tag:** `${{ steps.meta.outputs.image_tag }}`
          * **Digest:** `${{ steps.digest.outputs.image_ref }}`
          * **Rollback:** `${{ steps.meta.outputs.is_rollback }}`
          * **URL:** ${{ steps.release.outputs.service_url }}
          * **Smoke test:** passed (health, readiness, DB, HTML, endpoints)
          EOF
