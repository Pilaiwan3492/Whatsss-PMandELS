name: Continuous Integration (CI)

on:
  push:
    branches:
      - 'feat/**'
      - sprint-1
      - staging-lab5
      - main
  pull_request:
    branches:
      - 'feat/**'
      - sprint-1
      - staging-lab5
      - main

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsss_user
          POSTGRES_PASSWORD: whatsss_password
          POSTGRES_DB: whatsss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Deploy Prisma Migrations
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
          JWT_SECRET: "ci_pipeline_cryptographically_secure_jwt_secret_key_32_chars"
        run: npx tsx prisma/seed.ts

      - name: Run Backend Automated Tests
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
          JWT_SECRET: "ci_pipeline_cryptographically_secure_jwt_secret_key_32_chars"
          CLIENT_URL: "http://localhost:5173"
          NODE_ENV: test
        run: npm test

      - name: Build Server
        working-directory: server
        run: npm run build

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend Automated Tests
        working-directory: client
        run: npm test

      - name: Build Client
        working-directory: client
        run: npm run build

  docker:
    name: Docker Container Build & Probe
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-stage Docker Image
        run: docker build -t whatsss:ci .

      - name: Test Container Startup & Health Probes
        run: |
          docker run -d --name whatsss-ci-container \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e HOST=0.0.0.0 \
            -e JWT_SECRET="ci_test_super_secret_jwt_key_at_least_32_chars" \
            -e CLIENT_URL="http://localhost:8080" \
            -e DATABASE_URL="postgresql://test:test@127.0.0.1:5432/test" \
            -p 8080:8080 \
            whatsss:ci
          sleep 4
          curl -f http://localhost:8080/api/health || (docker logs whatsss-ci-container && exit 1)
          curl -f http://localhost:8080/ || (docker logs whatsss-ci-container && exit 1)
          docker rm -f whatsss-ci-container

  security-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan Repository for Sensitive Credential Files
        run: |
          echo "Verifying no forbidden environment or credential files are checked in..."
          FORBIDDEN_FILES=$(find . -maxdepth 3 \( -name ".env" -o -name ".env.production" -o -name "*.pem" -o -name "*.key" -o -name "*service-account*.json" \) ! -name ".env.example" ! -path "*/node_modules/*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "CRITICAL: Forbidden credential files detected:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "Secret scan clean: No forbidden credential files found in repository."
