name: Continuous Integration (CI)

on:
  push:
    branches:
      - 'feat/**'
      - sprint-1
      - main
  pull_request:
    branches:
      - sprint-1
      - main

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsss_user
          POSTGRES_PASSWORD: whatsss_password
          POSTGRES_DB: whatsss_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Deploy Prisma Migrations
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_db?schema=public"
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_db?schema=public"
          JWT_SECRET: "ci_pipeline_cryptographically_secure_jwt_secret_key_32_chars"
        run: npx tsx prisma/seed.ts

      - name: Run Backend Automated Tests
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_db?schema=public"
          JWT_SECRET: "ci_pipeline_cryptographically_secure_jwt_secret_key_32_chars"
          CLIENT_URL: "http://localhost:5173"
          NODE_ENV: test
        run: npm test

      - name: Build Server
        working-directory: server
        run: npm run build

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend Automated Tests
        working-directory: client
        run: npm test

      - name: Build Client
        working-directory: client
        run: npm run build
