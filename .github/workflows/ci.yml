name: Continuous Integration (CI)

on:
  push:
    branches:
      - 'feat/**'
      - sprint-1
      - staging-lab5
      - main
  pull_request:
    branches:
      - 'feat/**'
      - sprint-1
      - staging-lab5
      - main

jobs:
  backend:
    name: Backend Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: whatsss_user
          POSTGRES_PASSWORD: whatsss_password
          POSTGRES_DB: whatsss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma Client
        working-directory: server
        run: npx prisma generate

      - name: Deploy Prisma Migrations
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
          JWT_SECRET: "ci_pipeline_cryptographically_secure_jwt_secret_key_32_chars"
        run: npx tsx prisma/seed.ts

      - name: Run Backend Automated Tests
        working-directory: server
        env:
          DATABASE_URL: "postgresql://whatsss_user:whatsss_password@localhost:5432/whatsss_test?schema=public"
          JWT_SECRET: "ci_pipeline_cryptographically_secure_jwt_secret_key_32_chars"
          CLIENT_URL: "http://localhost:5173"
          NODE_ENV: test
        run: npm test

      - name: Build Server
        working-directory: server
        run: npm run build

  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend Automated Tests
        working-directory: client
        run: npm test

      - name: Build Client
        working-directory: client
        run: npm run build

  docker:
    name: Docker Container Build & Probe
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-stage Docker Image
        run: docker build -t whatsss:ci .

      - name: Test Container Startup & Health Probes
        run: |
          docker run -d --name whatsss-ci-container \
            -e NODE_ENV=production \
            -e PORT=8080 \
            -e HOST=0.0.0.0 \
            -e JWT_SECRET="ci_test_super_secret_jwt_key_at_least_32_chars" \
            -e CLIENT_URL="http://localhost:8080" \
            -e DATABASE_URL="postgresql://test:test@127.0.0.1:5432/test" \
            -p 8080:8080 \
            whatsss:ci
          sleep 4
          curl -f http://localhost:8080/api/health || (docker logs whatsss-ci-container && exit 1)
          curl -f http://localhost:8080/ || (docker logs whatsss-ci-container && exit 1)
          docker rm -f whatsss-ci-container

  security-scan:
    name: Secret & Credential Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan Repository for Sensitive Credential Files
        run: |
          echo "Verifying no forbidden environment or credential files are checked in..."
          FORBIDDEN_FILES=$(find . -maxdepth 3 \( -name ".env" -o -name ".env.production" -o -name "*.pem" -o -name "*.key" -o -name "*service-account*.json" \) ! -name ".env.example" ! -path "*/node_modules/*")
          if [ -n "$FORBIDDEN_FILES" ]; then
            echo "CRITICAL: Forbidden credential files detected:"
            echo "$FORBIDDEN_FILES"
            exit 1
          fi
          echo "Secret scan clean: No forbidden credential files found in repository."

  c03-clean-clone-verification:
    name: Check C-03 Clean Clone Build & Run Verification
    runs-on: ubuntu-latest
    needs: [docker]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Perform Clean Git Clone into Isolated Workspace
        run: |
          echo "Cloning clean repository from current workspace into isolated directory..."
          git clone "$GITHUB_WORKSPACE" ../clean-clone-test
          cd ../clean-clone-test
          git checkout "${{ github.sha }}"
          echo "Clean clone verified at commit: $(git rev-parse HEAD)"

      - name: Prepare .env with Dynamic Testing Secrets
        working-directory: ../clean-clone-test
        run: |
          cp .env.example .env

          # Generate dynamic random cryptographic secrets for isolated test execution
          CI_ADMIN_PWD="Admin_$(openssl rand -hex 12)!"
          CI_DEMO_PWD="Demo_$(openssl rand -hex 12)!"
          RANDOM_JWT="$(openssl rand -hex 32)"

          sed -i "s|replace_with_a_long_random_secret_at_least_32_characters_for_production|${RANDOM_JWT}|g" .env
          sed -i "s|replace_with_secure_admin_password_min_12_chars|${CI_ADMIN_PWD}|g" .env
          sed -i "s|SEED_DEMO_DATA=false|SEED_DEMO_DATA=true|g" .env
          sed -i "s|replace_with_secure_demo_password_min_12_chars|${CI_DEMO_PWD}|g" .env

          # Save demo user credentials for downstream authentication step
          echo "CI_DEMO_PWD=${CI_DEMO_PWD}" >> $GITHUB_ENV

      - name: Start Full Stack with Docker Compose (C-03)
        working-directory: ../clean-clone-test
        run: |
          docker compose -p whatsss_c03_ci up -d --build

          healthy=false
          for i in {1..30}; do
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' whatsss_app 2>/dev/null || echo "starting")
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              healthy=true
              break
            fi
            echo "Waiting for healthcheck ($i/30): $HEALTH_STATUS"
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Application failed to become healthy within timeout"
            docker compose -p whatsss_c03_ci ps
            docker compose -p whatsss_c03_ci logs --no-color --tail=200
            exit 1
          fi

          echo "Application is healthy!"
          docker compose -p whatsss_c03_ci ps
          docker logs whatsss_migrate

      - name: Probe Health (Liveness) Endpoint
        run: |
          echo "Probing /api/health (Liveness)..."
          HEALTH_RES=$(curl -f -s -i http://localhost:8080/api/health)
          echo "$HEALTH_RES"
          echo "$HEALTH_RES" | grep "HTTP/1.1 200 OK"
          echo "$HEALTH_RES" | grep '"status":"ok"'

      - name: Verify Readiness Probe State Discrimination (DB Healthy vs Outage vs Recovery)
        working-directory: ../clean-clone-test
        run: |
          echo "1. Asserting /api/ready returns 200 OK when database is connected..."
          READY_200=$(curl -s -i http://localhost:8080/api/ready)
          echo "$READY_200" | grep "HTTP/1.1 200 OK"
          echo "$READY_200" | grep '"database":"connected"'

          # Trap ensures postgres container is restarted if subsequent assertions fail
          trap 'docker compose -p whatsss_c03_ci start postgres || true' EXIT

          echo "2. Stopping PostgreSQL container to simulate database outage..."
          docker compose -p whatsss_c03_ci stop postgres

          echo "3. Asserting /api/ready returns 503 Service Unavailable during outage..."
          READY_503=$(curl -s -i http://localhost:8080/api/ready)
          echo "$READY_503"
          echo "$READY_503" | grep "HTTP/1.1 503"
          echo "$READY_503" | grep '"database":"disconnected"'

          echo "4. Asserting /api/health still returns 200 OK (liveness probe independence)..."
          LIVENESS_200=$(curl -s -i http://localhost:8080/api/health)
          echo "$LIVENESS_200" | grep "HTTP/1.1 200 OK"

          echo "5. Restarting PostgreSQL container to simulate recovery..."
          docker compose -p whatsss_c03_ci start postgres

          echo "Waiting for postgres recovery..."
          for i in {1..20}; do
            PG_STATUS=$(docker inspect --format='{{.State.Health.Status}}' whatsss_postgres 2>/dev/null || echo "starting")
            if [ "$PG_STATUS" = "healthy" ]; then
              echo "Postgres is healthy again!"
              break
            fi
            sleep 1
          done

          echo "6. Asserting /api/ready returns 200 OK after database recovery..."
          READY_RECOVERED=$(curl -s -i http://localhost:8080/api/ready)
          echo "$READY_RECOVERED" | grep "HTTP/1.1 200 OK"
          echo "$READY_RECOVERED" | grep '"database":"connected"'
          echo "Readiness probe state discrimination verified successfully!"

      - name: End-to-End API Authentication & Transaction Creation
        run: |
          echo "Authenticating as user_demo..."
          LOGIN_RES=$(curl -s -i -c cookie.txt -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:8080" \
            -d "{\"username\":\"user_demo\",\"password\":\"${CI_DEMO_PWD}\"}")
          echo "$LOGIN_RES" | grep "HTTP/1.1 200 OK"

          echo "Fetching baseline accounts and parsing UUIDs with jq..."
          ACCOUNTS_RES=$(curl -s -b cookie.txt http://localhost:8080/api/accounts)
          echo "$ACCOUNTS_RES"
          CHECKING_ID=$(echo "$ACCOUNTS_RES" | jq -er '.data.accounts[] | select(.name == "Checking Bank") | .id')
          SALARY_ID=$(echo "$ACCOUNTS_RES" | jq -er '.data.accounts[] | select(.name == "Salary") | .id')

          echo "Resolved Account IDs -> Checking Bank: $CHECKING_ID | Salary: $SALARY_ID"
          if [ -z "$CHECKING_ID" ] || [ -z "$SALARY_ID" ]; then
            echo "FATAL: Failed to resolve account IDs via jq!"
            exit 1
          fi

          echo "Recording income transaction of 25000.00 THB..."
          TX_RES=$(curl -s -i -b cookie.txt -X POST http://localhost:8080/api/transactions/income \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:8080" \
            -d "{\"primary_account_id\":\"${CHECKING_ID}\",\"income_account_id\":\"${SALARY_ID}\",\"total_amount\":\"25000.00\",\"transaction_date\":\"2026-11-13\",\"description\":\"CI C-03 Clean Clone Verification Transaction\"}")
          echo "$TX_RES" | grep "HTTP/1.1 201 Created"

      - name: Teardown and Re-launch Stack (Volume Persistence Verification)
        working-directory: ../clean-clone-test
        run: |
          echo "Executing docker compose down (preserving volume)..."
          docker compose -p whatsss_c03_ci down

          echo "Re-launching stack with existing PostgreSQL volume..."
          docker compose -p whatsss_c03_ci up -d

          healthy=false
          for i in {1..30}; do
            HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' whatsss_app 2>/dev/null || echo "starting")
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              healthy=true
              break
            fi
            echo "Waiting for healthcheck ($i/30): $HEALTH_STATUS"
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "::error::Application failed to become healthy after restart"
            docker compose -p whatsss_c03_ci ps
            docker compose -p whatsss_c03_ci logs --no-color --tail=200
            exit 1
          fi

          echo "whatsss_app is healthy after restart!"

      - name: Verify Transaction Persisted Across Teardown
        run: |
          echo "Re-logging in..."
          curl -s -i -c cookie_post.txt -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -H "Origin: http://localhost:8080" \
            -d "{\"username\":\"user_demo\",\"password\":\"${CI_DEMO_PWD}\"}" | grep "HTTP/1.1 200 OK"

          echo "Fetching transactions..."
          TX_LIST=$(curl -s -b cookie_post.txt http://localhost:8080/api/transactions)
          echo "$TX_LIST"
          echo "$TX_LIST" | grep "CI C-03 Clean Clone Verification Transaction" || (echo "FATAL: Test record did not persist across compose down!" && exit 1)
          echo "VERIFIED: Test transaction persisted successfully across container teardown!"

      - name: Clean up Docker Compose Stack
        if: always()
        working-directory: ../clean-clone-test
        run: |
          docker compose -p whatsss_c03_ci down -v || true
